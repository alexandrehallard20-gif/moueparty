<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Les zamis • 2 flaps</title>
    <meta
      name="description"
      content="Les photos de mes amis et tous nos souvenirs ensemble."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background: linear-gradient(180deg, #f7f3ee 0%, #f4efe9 100%);
        color: #1a1a1a;
      }

      * {
        box-sizing: border-box;
      }

      a {
        text-decoration: none;
        color: inherit;
      }

      .friends-page {
        min-height: 100vh;
        padding: 24px 5vw 80px;
      }

      .friends-header {
        max-width: 1200px;
        margin: 0 auto 40px;
      }

      .friends-header h1 {
        max-width: 760px;
        margin: 18px 0 14px;
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(3.2rem, 7vw, 6.5rem);
        line-height: 0.95;
      }

      .friends-header p:not(.eyebrow) {
        max-width: 650px;
        color: #5a5a5a;
        font-size: 1.08rem;
        line-height: 1.8;
      }

      .eyebrow {
        text-transform: uppercase;
        letter-spacing: 0.18em;
        font-size: 0.72rem;
        font-weight: 700;
        opacity: 0.9;
      }

      .friends-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto 10px;
      }

      .brand {
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(1.8rem, 3vw, 2.6rem);
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .friends-nav a {
        color: #a94b4b;
        font-weight: 600;
      }

      #friends-gallery {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 18px;
      }

      .friend-card {
        display: block;
        overflow: hidden;
        border-radius: 22px;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        transition: transform 0.25s ease, box-shadow 0.25s ease;
      }

      .friend-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 25px 55px rgba(0, 0, 0, 0.16);
      }

      .friend-card-image {
        position: relative;
        height: 180px;
        overflow: hidden;
        background: linear-gradient(135deg, #f4d8d1, #d8b7b7 50%, #aa8f9d);
      }

      .friend-card-image img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .friend-placeholder {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: rgba(255, 255, 255, 0.9);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .friend-number {
        position: absolute;
        top: 12px;
        left: 12px;
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.45);
        color: white;
        font-size: 0.7rem;
        font-weight: 700;
      }

      .friend-card h2 {
        margin: 16px 18px 4px;
        font-family: "Cormorant Garamond", serif;
        font-size: 2rem;
        line-height: 1;
      }

      .friend-card p {
        margin: 0 18px 18px;
        color: #5a5a5a;
        font-size: 0.82rem;
      }

      .footer {
        text-align: center;
        padding: 18px 20px 40px;
        color: #5a5a5a;
        font-size: 0.95rem;
      }

      @media (max-width: 700px) {
        .friends-nav {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }

        .friend-card-image {
          height: 170px;
        }
      }
    </style>
  </head>
  <body>
    <main class="friends-page">
      <nav class="friends-nav" aria-label="Navigation principale">
        <a class="brand" href="index.html">♥ 2 flaps</a>
        <a href="index.html">← Retour à l'accueil</a>
      </nav>

      <header class="friends-header">
        <p class="eyebrow">Nos souvenirs ensemble</p>
        <h1>Les zamis</h1>
        <p>
          Une page dédiée à toutes les personnes qui rendent les voyages,
          les soirées et les petits moments encore plus beaux.
        </p>
      </header>

      <div id="friends-gallery"></div>
    </main>

    <footer class="footer">
      <p>Fait avec mon cœur autistique • Les zamis</p>
    </footer>

    <script src="les-zamis.js"></script>
  </body>
</html>
