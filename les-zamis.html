<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Les zamis • 2 flaps</title>
    <meta name="description" content="Les photos de mes amis et tous nos souvenirs ensemble." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
      .friends-page {
        min-height: 100vh;
        padding: 24px 5vw 80px;
      }

      .friends-header {
        max-width: 1200px;
        margin: 0 auto 60px;
      }

      .friends-header h1 {
        max-width: 760px;
        margin: 20px 0 16px;
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(3.5rem, 8vw, 7rem);
        line-height: 0.95;
      }

      .friends-header p:not(.eyebrow) {
        max-width: 650px;
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.8;
      }

      .friends-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto;
      }

      .friends-nav .brand {
        color: var(--text);
      }

      .friends-nav a {
        color: var(--primary-dark);
        font-weight: 600;
      }

      .friend-section {
        max-width: 1200px;
        margin: 0 auto 70px;
      }

      .friend-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
      }

      .friend-heading h2 {
        margin: 0;
        font-family: "Cormorant Garamond", serif;
        font-size: clamp(2.3rem, 5vw, 4rem);
      }

      .friend-heading span {
        color: var(--muted);
        font-size: 0.9rem;
      }

      .friends-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        gap: 14px;
      }

      .friend-photo {
        min-height: 210px;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: flex-end;
        border-radius: 18px;
        background: linear-gradient(135deg, #f4d8d1, #d8b7b7 50%, #aa8f9d);
        box-shadow: var(--shadow);
      }

      .friend-photo img {
        width: 100%;
        height: 100%;
        min-height: 210px;
        object-fit: cover;
      }

      .friend-photo.placeholder::before {
        content: "Photo à ajouter";
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: rgba(255, 255, 255, 0.9);
        font-weight: 600;
      }

      .friend-photo figcaption {
        position: absolute;
        inset: auto 0 0;
        padding: 12px;
        color: white;
        background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
        font-size: 0.85rem;
      }

      @media (max-width: 700px) {
        .friends-nav {
          align-items: flex-start;
          gap: 18px;
          flex-direction: column;
        }

        .friend-heading {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="friends-page">
      <nav class="friends-nav" aria-label="Navigation principale">
        <a class="brand" href="index.html">♥ 2 flaps</a>
        <a href="index.html">← Retour à l'accueil</a>
      </nav>

      <header class="friends-header">
        <p class="eyebrow">Nos souvenirs ensemble</p>
        <h1>Les zamis</h1>
        <p>
          Une page dédiée à toutes les personnes qui rendent les voyages,
          les soirées et les petits moments encore plus beaux.
        </p>
      </header>

      <div id="friends-gallery"></div>
    </main>

    <footer class="footer">
      <p>Fait avec mon cœur autistique • Les zamis</p>
    </footer>

    <script src="les-zamis.js"></script>
  </body>
</html>
